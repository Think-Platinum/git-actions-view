name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run backend tests
        run: cd backend && npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm test

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gitactionsview .

  publish:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      # The version GAV reports (GET /api/health) must equal the release tag.
      - name: Check the tag matches package.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          for f in package.json backend/package.json frontend/package.json; do
            actual=$(node -p "require('./$f').version")
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$f::version $actual does not match tag $TAG"
              exit 1
            fi
          done
          echo "All package.json versions are $expected"
      # Linux images for both amd64 and arm64 (e.g. an Apple silicon host
      # running Colima). arm64 is built under QEMU on this Ubuntu runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
